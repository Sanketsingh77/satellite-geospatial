<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#ffffff"/>
  <style>
    .box{fill:#f7f7f7;stroke:#222;stroke-width:2;rx:12;ry:12}
    .title{font:700 24px Arial,sans-serif;fill:#111}
    .text{font:16px Arial,sans-serif;fill:#222}
    .small{font:14px Arial,sans-serif;fill:#444}
    .arrow{stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <text x="600" y="42" text-anchor="middle" class="title">Satellite Building-Segmentation Preprocessing Pipeline</text>

  <rect x="40" y="85" width="220" height="100" class="box"/>
  <text x="150" y="118" text-anchor="middle" class="title" font-size="20">Raw Inputs</text>
  <text x="150" y="145" text-anchor="middle" class="text">33cae6.tif</text>
  <text x="150" y="168" text-anchor="middle" class="text">33cae6.geojson</text>

  <rect x="310" y="85" width="220" height="100" class="box"/>
  <text x="420" y="118" text-anchor="middle" class="title" font-size="20">Raster Processing</text>
  <text x="420" y="145" text-anchor="middle" class="text">Inspect metadata</text>
  <text x="420" y="168" text-anchor="middle" class="text">Resample to 0.1 m/pixel</text>

  <rect x="580" y="85" width="220" height="100" class="box"/>
  <text x="690" y="118" text-anchor="middle" class="title" font-size="20">Geospatial Labels</text>
  <text x="690" y="145" text-anchor="middle" class="text">Read building polygons</text>
  <text x="690" y="168" text-anchor="middle" class="text">Reproject to image CRS</text>

  <rect x="850" y="85" width="310" height="100" class="box"/>
  <text x="1005" y="118" text-anchor="middle" class="title" font-size="20">Mask Generation</text>
  <text x="1005" y="145" text-anchor="middle" class="text">Rasterize polygons</text>
  <text x="1005" y="168" text-anchor="middle" class="text">Save binary mask GeoTIFF</text>

  <line x1="260" y1="135" x2="310" y2="135" class="arrow"/>
  <line x1="530" y1="135" x2="580" y2="135" class="arrow"/>
  <line x1="800" y1="135" x2="850" y2="135" class="arrow"/>

  <rect x="240" y="280" width="300" height="110" class="box"/>
  <text x="390" y="315" text-anchor="middle" class="title" font-size="20">Tiling</text>
  <text x="390" y="345" text-anchor="middle" class="text">1024 × 1024 image tiles</text>
  <text x="390" y="370" text-anchor="middle" class="text">1024 × 1024 mask tiles</text>

  <rect x="660" y="280" width="300" height="110" class="box"/>
  <text x="810" y="315" text-anchor="middle" class="title" font-size="20">Result</text>
  <text x="810" y="345" text-anchor="middle" class="text">754 aligned image/mask pairs</text>
  <text x="810" y="370" text-anchor="middle" class="small">Prepared for downstream segmentation models</text>

  <line x1="1005" y1="185" x2="930" y2="280" class="arrow"/>
  <line x1="420" y1="185" x2="390" y2="280" class="arrow"/>
  <line x1="540" y1="335" x2="660" y2="335" class="arrow"/>
</svg>
